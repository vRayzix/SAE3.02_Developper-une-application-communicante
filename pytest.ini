[pytest]
pythonpath = src
testpaths = tests
addopts = --strict-markers
# Un test bloqué échoue au bout de ce délai, en secondes, au lieu de figer toute la suite.
timeout = 60
markers =
    lent: test qui joue des traversées en temps réel ; « pytest -m "not lent" » les écarte
    bdd: test qui vise la vraie base MariaDB de config.ini ; ignoré si elle est injoignable
