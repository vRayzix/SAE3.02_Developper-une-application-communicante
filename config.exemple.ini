; Copier ce fichier en config.ini, puis adapter les valeurs.
; config.ini n'est pas versionné : il contient la clé HMAC et le mot de passe de la base.

[reseau]
; Adresse du serveur. Sur la machine du serveur : celle où il écoute (0.0.0.0 pour
; toutes les interfaces) ; sur le poste de supervision : l'adresse de la machine du serveur.
hote = 127.0.0.1
; Port TCP des messages qui doivent arriver (HELLO, NOTIF, STATE...).
port_tcp = 5050
; Port UDP des positions (POS).
port_udp = 5051

[securite]
; Clé HMAC partagée par le serveur, la supervision et les clients. Pour en générer une :
; python -c "import secrets; print(secrets.token_hex(32))"
cle_hmac = remplacer_par_une_cle_secrete
; Écart maximal accepté entre l'horodatage d'une trame et l'heure locale, en secondes.
fenetre_anti_rejeu = 5

[delais]
; Toutes les valeurs sont en secondes.
; Intervalle entre deux PING d'un client ou de la supervision.
intervalle_ping = 2
; Silence au bout duquel le serveur retire un client, et un client se croit déconnecté.
timeout_client = 6
; Intervalle entre deux positions envoyées par un client.
intervalle_position = 0.2
; Délai entre deux STATE envoyés aux supervisions, qui cadence aussi le contrôle des heartbeats.
intervalle_etat = 0.2
; Premier délai avant une reconnexion ; il double à chaque échec.
backoff_initial = 1
; Plafond du délai de reconnexion.
backoff_max = 10

[rond_point]
; Rond-point André Marie Talvas, à Bel Air (voir docs/geometrie_bel_air.md).
; Identifiants des branches, utilisés dans le protocole : minuscules sans accents,
; chiffres et « _ ». Chacune est décrite dans sa section [branche.<identifiant>].
branches = nations_nord, jean_de_la_bruyere, nations_sud, albert_camus
; Rayon de l'axe de l'anneau, entre ses deux voies, en mètres.
rayon = 20
; Largeur de chacune des deux voies de l'anneau, en mètres.
largeur_voie_anneau = 4.5
; Largeur de la chaussée de chaque sens d'une branche (une voie), en mètres.
largeur_chaussee = 5
; Longueur modélisée de chaque branche, depuis le bord de l'anneau, en mètres.
longueur_branche = 50
; Nombre d'usagers à partir duquel une branche est considérée pleine (densité 1).
capacite_par_branche = 8

; Pour chaque branche : libellé affiché, cap en degrés (0 = nord, sens des aiguilles
; d'une montre), largeur du terre-plein entre les deux chaussées et distance entre le
; bord de l'anneau et le passage piéton, en mètres.
[branche.nations_nord]
libelle = Bd des Nations (nord)
cap = 340
terre_plein = 8
passage_pieton = 10

[branche.jean_de_la_bruyere]
libelle = Rue Jean de la Bruyère
cap = 57
terre_plein = 2.5
passage_pieton = 8

[branche.nations_sud]
libelle = Bd des Nations (sud)
cap = 147
terre_plein = 7.5
passage_pieton = 6

[branche.albert_camus]
libelle = Rue Albert Camus
cap = 230
terre_plein = 3
passage_pieton = 8

[bdd]
; Base MariaDB de l'historique. Seul le serveur s'y connecte ; la supervision n'en lit
; aucune valeur, mais la section doit être présente.
; Adresse du serveur MariaDB : localhost, ou l'adresse de la VM bdd.
hote = localhost
; Port de MariaDB.
port = 3306
; Utilisateur dédié, autorisé depuis la machine du serveur.
utilisateur = cherrypie
; Mot de passe de cet utilisateur.
mot_de_passe = remplacer_par_le_mot_de_passe
; Nom de la base.
base = cherrypie
; Attente maximale d'une connexion à la base, en secondes.
delai_connexion = 3
; Délai avant de réessayer quand la base est injoignable (le serveur continue de tourner), en secondes.
delai_reessai = 10
; Intervalle entre deux relevés de densité écrits en base, en secondes.
intervalle_releves = 5
